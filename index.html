<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMK Putra Bangsa | XII TKJ & ACC</title>
<style>
:root{--navy:#1c1c3d;--deep:#0a0a1c;--lav:#e8e9f7;--gold:#f2c94c;--cyan:#27e6ff;--cream:#f6ecd9;--cream-edge:#f3e3c0;--ink:#3b2a1e;--glow:243,214,150}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--deep);font-family:"Poppins","Segoe UI",sans-serif;overflow:hidden;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 110%,#2a1b4d,var(--deep) 70%)}

/* HALAMAN 1: foto kelas */
.photo-layer{position:absolute;inset:0;overflow:hidden;animation:photoFade 1.3s ease forwards 7.5s}
.photo-bg{display:none}
@keyframes bgzoom{to{transform:scale(1.32) translate(-1%,1%)}}
.photo-fg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.photo-fg img{display:block;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;object-position:center 60%;border-radius:0;box-shadow:none}
@keyframes softzoom{to{transform:scale(1.02)}}
.photo-layer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,10,30,.6),rgba(4,10,30,.38) 45%,rgba(4,10,30,.82));pointer-events:none}
.photo-caption{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(90%,640px);text-align:center;color:var(--lav);z-index:2;padding:28px 24px}
.photo-caption::before{content:"";position:absolute;inset:-10% -8%;background:radial-gradient(ellipse at center,rgba(10,10,28,.55),rgba(10,10,28,0) 72%);z-index:-1}
.photo-caption>*{opacity:0;filter:blur(8px);transform:translateY(12px) scale(1.04);animation:textReveal 1.2s cubic-bezier(.2,.7,.2,1) forwards}
.eyebrow{letter-spacing:.5em;font-size:clamp(.6rem,2.2vw,.76rem);text-transform:uppercase;color:var(--gold);font-weight:600;animation-delay:1s!important}
.photo-caption h2{margin-top:8px;letter-spacing:.06em;font-size:clamp(.95rem,3.4vw,1.3rem);font-weight:700;line-height:1.4;animation-delay:1.7s!important}
.accent{margin-top:9px;letter-spacing:.32em;font-size:clamp(.72rem,2.7vw,.92rem);text-transform:uppercase;color:var(--gold);font-weight:700;animation-delay:2.7s!important}
@keyframes textReveal{to{opacity:1;filter:blur(0);transform:none}}
@keyframes photoFade{to{opacity:0;visibility:hidden}}

/* transisi iris */
.wipe{position:absolute;inset:0;background:radial-gradient(circle,var(--navy),var(--deep));background-size:cover;background-position:center 60%;clip-path:circle(0% at 50% 50%);animation:iris 1.7s cubic-bezier(.65,0,.35,1) forwards 7.35s;z-index:3}
@keyframes iris{to{clip-path:circle(75% at 50% 50%)}}

/* partikel interaktif */
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:4;opacity:0;animation:fadein 1.5s ease forwards 7.8s;pointer-events:none}
@keyframes fadein{to{opacity:1}}

/* HALAMAN 2: logo neon + tombol tahan + tombol masuk */
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinrev{to{transform:rotate(-360deg)}}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.9vh,14px);text-align:center;z-index:5;padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom))}
.logo-wrap{position:relative;width:min(17vmin,110px);height:min(17vmin,110px);border-radius:50%;opacity:0;transform:scale(.35) rotate(-30deg);background:var(--cream);box-shadow:0 0 0 3px var(--cream-edge),0 0 22px 3px rgba(var(--glow),.75);animation:logoIn 1.6s cubic-bezier(.34,1.56,.64,1) forwards 8.65s,float 3.6s ease-in-out infinite 10.25s,neon 2.8s ease-in-out infinite 10.25s}
.logo-wrap img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.glow{position:absolute;inset:-55%;border-radius:50%;background:radial-gradient(circle,rgba(39,230,255,.28),rgba(10,10,28,0) 68%);z-index:-1;pointer-events:none}
.ring{position:absolute;inset:-12%;border-radius:50%;border:1px dashed rgba(127,246,255,.45);animation:spin 22s linear infinite;pointer-events:none}
.ring.r2{inset:-26%;border-color:rgba(242,201,76,.35);animation:spinrev 28s linear infinite}
@keyframes logoIn{60%{opacity:1;transform:scale(1.1) rotate(4deg)}80%{transform:scale(.96) rotate(-2deg)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes neon{50%{box-shadow:0 0 0 3px #fff4d8,0 0 38px 8px rgba(var(--glow),.9)}}
.brand{opacity:0;transform:translateY(14px);animation:riseIn .9s ease forwards 10.2s}
.brand h1{color:#fff;font-size:clamp(.9rem,3.2vw,1.3rem);letter-spacing:.08em;font-weight:700;text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.75)}
.brand p{margin-top:4px;color:var(--gold);font-size:clamp(.7rem,2.5vw,.88rem);letter-spacing:.2em;font-weight:600;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.75)}
@keyframes riseIn{to{opacity:1;transform:none}}

/* tombol tahan untuk masuk (neon) */
#gate{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(14px);animation:riseIn .9s ease forwards 11s;transition:opacity .6s,transform .6s}
#gate.gone{opacity:0!important;transform:scale(1.4)!important;pointer-events:none;animation:none}
#btn{position:relative;overflow:hidden;isolation:isolate;width:clamp(82px,20vw,94px);aspect-ratio:1;border-radius:50%;border:2px solid #4ff0ff;background:rgba(6,18,40,.55);color:#fff;font:600 clamp(9px,2.5vw,11px)/1.4 "Poppins","Segoe UI",sans-serif;text-shadow:0 0 10px rgba(39,230,255,.7);outline:1px solid rgba(79,240,255,.6);outline-offset:-5px;cursor:pointer;touch-action:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 14px rgba(39,230,255,.75),0 0 38px rgba(39,230,255,.35),inset 0 0 16px rgba(39,230,255,.4);animation:pulseCyan 2.6s ease-in-out infinite;transition:transform .25s,box-shadow .25s}
#btn::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle,rgba(201,252,255,.9),rgba(39,230,255,.55) 70%);opacity:calc(var(--p,0)*.38);pointer-events:none}
#btn.hold{transform:scale(.93);animation:none;box-shadow:0 0 42px 8px rgba(39,230,255,.85),0 0 90px 20px rgba(39,230,255,.35),inset 0 0 24px rgba(39,230,255,.6)}
#btn svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#btn circle{fill:none;stroke-width:5}
#track{stroke:rgba(255,255,255,.12)}
#bar{stroke:#c9fcff;stroke-linecap:round;stroke-dasharray:377;stroke-dashoffset:377;filter:drop-shadow(0 0 8px var(--cyan))}
#btn span{position:relative;pointer-events:none}
#hint{margin-top:9px;font-size:10.5px;color:var(--lav);opacity:.7}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(var(--glow),.12),0 0 36px rgba(var(--glow),.65),inset 0 0 16px rgba(var(--glow),.35)}}
@keyframes pulseCyan{50%{box-shadow:0 0 0 14px rgba(39,230,255,.08),0 0 44px rgba(39,230,255,.7),0 0 38px rgba(39,230,255,.35),inset 0 0 20px rgba(39,230,255,.5)}}

/* tombol Beranda + Music: neon, menyala saat diklik (muncul setelah berhasil) */
#links{display:none;flex-direction:column;align-items:center;gap:10px}
#links.show{display:flex}
.beranda-btn,.music-btn{position:relative;overflow:hidden;isolation:isolate;text-decoration:none;color:#fff;border:2px solid #4ff0ff;background:rgba(6,18,40,.55);box-shadow:0 0 14px rgba(39,230,255,.75),0 0 38px rgba(39,230,255,.35),inset 0 0 16px rgba(39,230,255,.4);opacity:0;transition:box-shadow .3s,color .25s,border-color .3s}
.beranda-btn::before,.music-btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,#c9fcff,var(--cyan));opacity:0;transition:opacity .25s}
.beranda-btn::after,.music-btn::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#fff,rgba(39,230,255,.65) 35%,rgba(39,230,255,0) 70%);opacity:0;pointer-events:none}
.beranda-btn{display:inline-flex;align-items:center;justify-content:center;min-width:min(60vw,190px);padding:10px 26px;border-radius:18px;font-size:clamp(.72rem,2.6vw,.86rem);letter-spacing:.08em;text-transform:uppercase;font-weight:700;text-shadow:0 0 10px rgba(39,230,255,.7);outline:1px solid rgba(79,240,255,.6);outline-offset:-5px;animation:riseIn .8s ease forwards .2s,neonPulse 2.6s ease-in-out infinite 1.2s}
.music-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;color:#9ff6ff;animation:riseIn .8s ease forwards .5s}
.music-btn svg{width:15px;height:15px;fill:currentColor}
@keyframes neonPulse{50%{filter:drop-shadow(0 0 12px rgba(39,230,255,.7))}}
.beranda-btn:active,.music-btn:active,.beranda-btn.lit,.music-btn.lit{color:#02192b;text-shadow:none;border-color:#c9fcff;box-shadow:0 0 30px 6px rgba(39,230,255,.85),0 0 90px 24px rgba(39,230,255,.4)}
.beranda-btn:active::before,.music-btn:active::before,.beranda-btn.lit::before,.music-btn.lit::before{opacity:1}
.beranda-btn.lit::after,.music-btn.lit::after{animation:flash .85s ease-out}
@keyframes flash{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}
.beranda-btn:focus-visible,.music-btn:focus-visible,#btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
@media(hover:hover){.beranda-btn:hover,.music-btn:hover{border-color:#c9fcff;box-shadow:0 0 22px rgba(39,230,255,.95),0 0 56px rgba(39,230,255,.5),inset 0 0 20px rgba(39,230,255,.5)}}
#mute{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:9;width:34px;height:34px;border-radius:50%;border:2px solid var(--cream-edge);background:var(--cream);color:var(--ink);font-size:14px;cursor:pointer;box-shadow:0 0 14px rgba(var(--glow),.5)}
#mute.wait{animation:pulse 1.6s ease-in-out infinite}
#pip{position:fixed;top:max(12px,env(safe-area-inset-top));right:54px;z-index:9;width:34px;height:34px;border-radius:50%;border:2px solid var(--cream-edge);background:var(--cream);color:var(--ink);font-size:14px;cursor:pointer;box-shadow:0 0 14px rgba(var(--glow),.5)}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:20;background:var(--cream);color:var(--ink);border:2px solid var(--cream-edge);border-radius:14px;padding:10px 16px;font-size:12px;max-width:86vw;text-align:center;transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 0 14px rgba(var(--glow),.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== LAYAR "MIRINGKAN HP" (hanya tampil di HP saat portrait) ===== */
html.rot #scene *,html.rot #scene *::before,html.rot #scene *::after,html.pend #scene *,html.pend #scene *::before,html.pend #scene *::after{animation-play-state:paused!important}
#rotate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:max(24px,env(safe-area-inset-top)) 28px max(24px,env(safe-area-inset-bottom));text-align:center;color:var(--lav);background:radial-gradient(ellipse at 50% 110%,#2a1b4d,var(--deep) 70%);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .6s ease,visibility .6s}
html.rot #rotate{opacity:1;visibility:visible;pointer-events:auto}
#rotate .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(243,214,150,.5) 1px,transparent 1.5px),radial-gradient(rgba(127,246,255,.4) 1px,transparent 1.5px);background-size:46px 46px,71px 71px;background-position:0 0,23px 31px;opacity:.35;animation:dotsDrift 14s linear infinite;pointer-events:none}
@keyframes dotsDrift{to{background-position:0 46px,23px 102px}}
.rp-stage{position:relative;width:190px;height:190px;display:grid;place-items:center}
.rp-glow{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(var(--glow),.28),rgba(10,10,28,0) 66%);animation:rpGlow 3.4s ease-in-out infinite}
@keyframes rpGlow{50%{transform:scale(1.12);opacity:.75}}
.rp-ring{position:absolute;inset:6%;border-radius:50%;border:1px dashed rgba(243,214,150,.4);animation:spin 24s linear infinite}
.rp-phone{position:relative;width:70px;height:122px;border-radius:15px;border:4px solid var(--cream-edge);background:linear-gradient(160deg,rgba(246,236,217,.16),rgba(246,236,217,.04));box-shadow:0 0 24px rgba(var(--glow),.65),inset 0 0 16px rgba(var(--glow),.3);animation:phoneTilt 3.6s cubic-bezier(.65,0,.35,1) infinite}
.rp-phone::before{content:"";position:absolute;top:6px;left:50%;width:22px;height:5px;margin-left:-11px;border-radius:4px;background:var(--cream-edge);opacity:.9}
.rp-phone::after{content:"";position:absolute;left:10px;right:10px;bottom:14px;height:48px;border-radius:7px;background:linear-gradient(135deg,rgba(243,214,150,.55),rgba(127,246,255,.35));opacity:.8}
.rp-phone i{position:absolute;left:10px;right:10px;top:22px;height:5px;border-radius:3px;background:rgba(246,236,217,.5);box-shadow:0 11px 0 -1px rgba(246,236,217,.3),0 22px 0 -1px rgba(246,236,217,.3)}
@keyframes phoneTilt{0%,14%{transform:rotate(0)}40%,74%{transform:rotate(-90deg)}92%,100%{transform:rotate(0)}}
.rp-arrow{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.rp-arrow path{fill:none;stroke:#f3e3c0;stroke-width:3;stroke-linecap:round;stroke-dasharray:150;stroke-dashoffset:150;filter:drop-shadow(0 0 6px rgba(var(--glow),.9));animation:arrowDraw 3.6s ease-in-out infinite}
.rp-arrow polygon{fill:#f3e3c0;opacity:0;filter:drop-shadow(0 0 6px rgba(var(--glow),.9));animation:arrowHead 3.6s ease-in-out infinite}
@keyframes arrowDraw{0%,12%{stroke-dashoffset:150;opacity:0}20%{opacity:1}40%,74%{stroke-dashoffset:0;opacity:1}88%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes arrowHead{0%,36%{opacity:0}42%,74%{opacity:1}88%,100%{opacity:0}}
#rotate .eyebrow{animation:none!important;opacity:1;filter:none;transform:none;font-size:clamp(.68rem,2.7vw,.85rem)}
#rotate h2{font-size:clamp(1.3rem,6vw,1.75rem);font-weight:700;letter-spacing:.05em;line-height:1.35;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7);margin-top:8px}
#rotate p.sub{margin-top:10px;font-size:clamp(.82rem,3.4vw,.98rem);line-height:1.6;color:var(--lav);opacity:.85;max-width:300px;margin-inline:auto}
#rotate .lockhint{margin-top:14px;font-size:12px;color:var(--gold);opacity:.9;letter-spacing:.04em}
#rotate .txt{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}

/* tampilan landscape di HP: logo + teks di kiri, tombol di kanan */
@media(orientation:landscape){
  html.is-phone .stage{display:grid;grid-template-columns:auto auto;grid-template-areas:"logo act" "brand act";justify-content:center;align-content:center;align-items:center;column-gap:clamp(28px,9vw,90px);row-gap:12px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
  html.is-phone .logo-wrap{grid-area:logo;justify-self:center;width:min(24vh,84px);height:min(24vh,84px)}
  html.is-phone .brand{grid-area:brand}
  html.is-phone .brand h1{font-size:clamp(.8rem,3vh,1.05rem)}
  html.is-phone #gate,html.is-phone #links{grid-area:act}
  html.is-phone .photo-caption{padding:12px 24px}
  html.is-phone .photo-fg img{max-height:none}
}

/* ===== LAYAR "KETUK UNTUK MEMULAI" (hanya jika browser memblokir suara otomatis) ===== */
#tapgate{position:fixed;inset:0;z-index:49;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;text-align:center;cursor:pointer;background:radial-gradient(ellipse at 50% 110%,#2a1b4d,var(--deep) 70%);color:var(--lav);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .6s ease,visibility .6s}
html.needtap #tapgate{opacity:1;visibility:visible;pointer-events:auto}
.tg-btn{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--cream);border:2px solid var(--cream-edge);box-shadow:0 0 22px 4px rgba(var(--glow),.7);animation:tgPulse 2s ease-in-out infinite}
.tg-btn svg{width:36px;height:36px;fill:#9a6a1c}
.tg-btn::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(243,214,150,.55);animation:tgRing 2s ease-out infinite}
@keyframes tgPulse{50%{transform:scale(1.06);box-shadow:0 0 40px 10px rgba(var(--glow),.85)}}
@keyframes tgRing{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
#tapgate h2{font-size:clamp(1rem,4.2vw,1.3rem);font-weight:700;letter-spacing:.05em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#tapgate p{margin-top:6px;font-size:clamp(.74rem,3vw,.88rem);color:var(--lav);opacity:.85}
@media(prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
<script>
// ===== DETEKSI HP & ORIENTASI (hanya HP yang diminta memiringkan layar; laptop/PC tidak) =====
(function(){
  var ua=navigator.userAgent||'',uad=navigator.userAgentData;
  var uaMobile=/Android.+Mobile|iPhone|iPod|Windows Phone|IEMobile|BlackBerry|Opera Mini|Mobi/i.test(ua)||!!(uad&&uad.mobile===true);
  var touchOnly=!!(window.matchMedia&&matchMedia('(hover:none) and (pointer:coarse)').matches);
  var smallScreen=Math.min(screen.width,screen.height)<=700;   // HP, bukan tablet/laptop
  window.IS_PHONE=!!(uaMobile||(touchOnly&&smallScreen));
  var inFrame=false;try{inFrame=window.top!==window.self}catch(e){inFrame=true}
  window.isPortrait=function(){
    if(inFrame&&screen.orientation&&screen.orientation.type)return screen.orientation.type.indexOf('portrait')===0; // embed: pakai orientasi perangkat
    return window.innerHeight>window.innerWidth};
  var h=document.documentElement;h.classList.add('pend');
  if(window.IS_PHONE){h.classList.add('is-phone');if(window.isPortrait())h.classList.add('rot')}
})();
</script>
</head>
<body>
<div id="scene">
  <div class="photo-layer">
    <div class="photo-bg" id="bg"></div>
    <div class="photo-fg"><img id="foto" alt="Momen kelas" style="display:none"></div>
    <div class="photo-caption">
      <p class="eyebrow" id="t_eyebrow"></p>
      <h2 id="t_caption"></h2>
      <p class="accent" id="t_accent"></p>
    </div>
  </div>
  <div class="wipe" id="wipe"></div>
  <canvas id="fx"></canvas>

  <div class="stage">
    <div class="logo-wrap" id="logoBox"><i class="glow"></i><i class="ring"></i><i class="ring r2"></i><img id="logoImg" alt="Logo SMK Putra Bangsa XII TKJ &amp; ACC"></div>
    <div class="brand"><h1 id="t_brand"></h1><p id="t_brandsub"></p></div>

    <div id="gate">
      <button id="btn" aria-label="Tahan untuk masuk">
        <svg viewBox="0 0 132 132"><circle id="track" cx="66" cy="66" r="60"/><circle id="bar" cx="66" cy="66" r="60"/></svg>
        <span id="t_btn"></span>
      </button>
      <div id="hint"></div>
    </div>

    <div id="links">
      <a class="beranda-btn" id="goHome" href="https://sites.google.com/view/twelve-tkj-acc/beranda?authuser=0" target="_blank" rel="noopener noreferrer"><span id="t_home"></span></a>
      <a class="music-btn" id="goMusic" href="https://sites.google.com/view/twelve-tkj-acc/beranda/music?authuser=0" target="_blank" rel="noopener noreferrer" aria-label="Music" title="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v10.55A4 4 0 1 0 11 17V7h8V3H9z"/></svg></a>
    </div>
  </div>
</div>
<button id="mute" aria-label="Suara">🔊</button>
<div id="tapgate" role="button" tabindex="0" aria-label="Ketuk layar untuk memulai">
  <div class="tg-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v10.55A4 4 0 1 0 11 17V7h8V3H9z"/></svg></div>
  <div><h2 id="tg_title"></h2><p id="tg_sub"></p></div>
</div>
<div id="rotate" role="alert" aria-live="polite">
  <div class="dots"></div>
  <div class="rp-stage">
    <i class="rp-glow"></i><i class="rp-ring"></i>
    <svg class="rp-arrow" viewBox="0 0 190 190" aria-hidden="true"><path d="M44 40 A72 72 0 0 1 150 44"/><polygon points="150,30 164,52 140,56"/></svg>
    <div class="rp-phone"><i></i></div>
  </div>
  <div class="txt">
    <p class="eyebrow">Biar lebih maksimal</p>
    <h2 id="r_title"></h2>
    <p class="sub" id="r_sub"></p>
    <p class="lockhint" id="r_lock"></p>
  </div>
</div>
<button id="pip" aria-label="Buka pemutar mini" title="Pemutar mini: musik tetap berputar di jendela terpisah">🎧</button>

<script>
// ==================================================================

// ===== MUSIK LATAR: Hindia - Kita ke Sana =====
const MUSIC_VOL=.9;
const bgm=new Audio();bgm.loop=true;bgm.preload='auto';bgm.setAttribute('playsinline','');
bgm.src=BGM_URL;
let muted=false,musicOn=false,starting=false,fadeT,pw=null,pollT,lastT=0,popupUsed=false;function popupPlaying(){try{return !!(pw&&!pw.closed&&pw.__playing)}catch(e){return false}}
function fadeTo(v,ms){clearInterval(fadeT);const from=bgm.volume,t0=performance.now();
  fadeT=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);bgm.volume=from+(v-from)*k;if(k>=1)clearInterval(fadeT)},50)}
let duckT;
function duck(ms){if(!musicOn||muted||popupPlaying())return;clearTimeout(duckT);fadeTo(MUSIC_VOL*.25,90);duckT=setTimeout(()=>fadeTo(MUSIC_VOL,700),ms)}
function startMusic(){if(musicOn||starting||popupPlaying())return;starting=true;bgm.volume=0.05;
  const ok=()=>{musicOn=true;starting=false;$('mute').classList.remove('wait');fadeTo(MUSIC_VOL,1800);if(window.__afterMusicOn)window.__afterMusicOn()};
  const fail=()=>{starting=false};
  try{const p=bgm.play();if(p&&p.then)p.then(ok,fail);else ok()}catch(e){fail()}}
// browser baru mengizinkan suara setelah sentuhan pertama -> coba di setiap sentuhan sampai berhasil
['pointerdown','pointerup','touchstart','touchend','click','keydown'].forEach(ev=>addEventListener(ev,startMusic,{capture:true,passive:true}));
// musik TIDAK dijeda saat tab disembunyikan / pindah aplikasi -> tetap berputar
if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:'Kita ke Sana',artist:'Hindia',album:'XII TKJ & ACC'});
  navigator.mediaSession.setActionHandler('play',()=>{bgm.play().catch(()=>{})});
  navigator.mediaSession.setActionHandler('pause',()=>{bgm.pause()})}catch(e){}}

// ===== SUARA EFEK (dibuat browser, tanpa file) =====
let ac,master;
const SFX_GAIN=1.8; // volume suara klik/efek (naikkan lagi kalau masih kurang keras)
function initAudio(){if(ac){if(ac.state==='suspended')ac.resume();return}
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();master=ac.createGain();master.gain.value=muted?0:SFX_GAIN;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-8;comp.knee.value=10;comp.ratio.value=10;comp.attack.value=.002;comp.release.value=.2;
  const lim=ac.createGain();lim.gain.value=.8;master.connect(comp);comp.connect(lim);lim.connect(ac.destination)}
function tone(f,t0,d,type='sine',v=.2){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
const SC=[523.25,587.33,659.25,783.99,880,1046.5,1174.7,1318.5];
function chime(){duck(2400);[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{tone(f,i*.11,1.4,'sine',.5);tone(f*2,i*.11,.8,'triangle',.14)});tone(130.8,0,1.8,'sine',.6)}
function clickSfx(){initAudio();duck(800);tone(880,0,.2,'triangle',.7);tone(1320,.05,.24,'sine',.55);tone(1760,.1,.34,'sine',.4);tone(220,0,.14,'square',.14)}
$('mute').onclick=()=>{if(popupPlaying()){pw.focus();toast('Musik sedang diputar di jendela pemutar mini');return}initAudio();if(!musicOn&&!muted){startMusic();return}muted=!muted;bgm.muted=muted;$('mute').textContent=muted?'🔇':'🔊';if(master){if(muted)setTimeout(()=>{if(muted)master.gain.value=0},450);else master.gain.value=SFX_GAIN}};

// nyala + percikan saat tombol Beranda/Music diklik
function light(el,x,y){const r=el.getBoundingClientRect();el.style.setProperty('--x',(x-r.left)+'px');el.style.setProperty('--y',(y-r.top)+'px');
  el.classList.remove('lit');void el.offsetWidth;el.classList.add('lit');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('lit'),900);
  burst(x*dpr,y*dpr,70,7);if(navigator.vibrate)navigator.vibrate(20)}
['goHome','goMusic'].forEach(i=>{const el=$(i);
  el.addEventListener('pointerdown',e=>light(el,e.clientX,e.clientY));
  el.addEventListener('click',e=>{initAudio();if(!e.detail){const r=el.getBoundingClientRect();light(el,r.left+r.width/2,r.top+r.height/2)}
    clickSfx()})});

// ===== TOMBOL MUSIK ♪: langsung menyalakan musik =====
function forceMusic(){
  if(muted){muted=false;bgm.muted=false;$('mute').textContent='🔊';if(master)master.gain.value=SFX_GAIN}
  if(popupPlaying())return;
  if(musicOn){if(bgm.paused)bgm.play().catch(()=>{});fadeTo(MUSIC_VOL,500)}
  else startMusic();
}
$('goMusic').addEventListener('click',forceMusic);

// ===== PEMUTAR MINI (jendela pop-up, tetap berputar saat kamu pindah halaman/website) =====
function toast(m){let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}
  e.textContent=m;e.className='on';clearTimeout(e._t);e._t=setTimeout(()=>e.className='',3800)}
function miniHTML(t){return `<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>♪ Kita ke Sana – Hindia</title>
<style>*{box-sizing:border-box;margin:0}body{font-family:"Poppins","Segoe UI",sans-serif;background:#1c1c3d;color:#f6ecd9;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center}
h1{font-size:15px}p{font-size:11px;opacity:.75;line-height:1.5}.r{display:flex;align-items:center;gap:12px}
#pp{width:52px;height:52px;border-radius:50%;border:2px solid #f3e3c0;background:#f6ecd9;color:#3b2a1e;font-size:18px;cursor:pointer;box-shadow:0 0 16px rgba(243,214,150,.7)}
#vol{width:110px;accent-color:#f3e3c0}</style></head><body>
<h1>🎵 Hindia – Kita ke Sana</h1><div class="r"><button id="pp" aria-label="Putar / jeda">▶</button><input id="vol" type="range" min="0" max="1" step="0.05" value="0.9" aria-label="Volume"></div>
<p id="st">Memuat…</p><p>Biarkan jendela ini tetap terbuka — musik terus berputar walau kamu pindah halaman atau website.</p>
<audio id="a" loop preload="auto" src="${BGM_URL}"></audio>
<script>
var a=document.getElementById('a'),b=document.getElementById('pp'),v=document.getElementById('vol'),st=document.getElementById('st'),start=${t};
a.volume=.9;
function ui(){b.textContent=a.paused?'▶':'❚❚';st.textContent=a.paused?'Dijeda — tekan ▶':'Sedang diputar'}
a.addEventListener('loadedmetadata',function(){try{a.currentTime=start}catch(e){}});
a.addEventListener('play',function(){window.__playing=true;ui()});a.addEventListener('pause',function(){window.__playing=false;ui()});
a.addEventListener('timeupdate',function(){window.__t=a.currentTime});
function blip(){try{var C=window.AudioContext||window.webkitAudioContext;if(!window.__c)window.__c=new C();var c=window.__c,o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='triangle';o.frequency.value=880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.7,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.25)}catch(e){}}
b.onclick=function(){blip();if(a.paused)a.play().catch(function(){});else a.pause()};
v.oninput=function(){a.volume=+v.value};
a.play().then(ui,ui);
if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:'Kita ke Sana',artist:'Hindia'});navigator.mediaSession.setActionHandler('play',function(){a.play()});navigator.mediaSession.setActionHandler('pause',function(){a.pause()})}catch(e){}}
<\/script></body></html>`}
function openMini(){
  if(pw&&!pw.closed){pw.focus();return}
  const t=bgm.currentTime||0;
  const w=window.open('','kita_ke_sana_player','popup=yes,width=360,height=230,left='+Math.max(0,screen.width-400)+',top=80');
  if(!w){toast('Pop-up diblokir browser. Izinkan pop-up untuk halaman ini, lalu tekan 🎧 lagi.');return}
  w.document.open();w.document.write(miniHTML(t));w.document.close();
  pw=w;lastT=t;popupUsed=false;
  clearInterval(pollT);pollT=setInterval(()=>{
    if(pw&&!pw.closed){try{if(pw.__t)lastT=pw.__t;if(pw.__playing){popupUsed=true;if(!bgm.paused)bgm.pause()}}catch(e){}}
    else{clearInterval(pollT);pw=null;if(popupUsed){try{bgm.currentTime=lastT}catch(e){}if(!muted)bgm.play().catch(()=>{})}}},700)}
$('pip').addEventListener('click',()=>{clickSfx();openMini()});
$('mute').addEventListener('click',()=>clickSfx());

// ===== PARTIKEL INTERAKTIF =====
const cv=$('fx'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
let W,H,mx=-999,my=-999,P=[],B=[],T=[];
function size(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}addEventListener('resize',size);size();
const N=innerWidth<600?60:100,HUE=[42,340,215];
for(let i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*2+.6)*dpr,vy:(Math.random()*.3+.05)*dpr,tw:Math.random()*6,h:HUE[i%3]});
function pt(e){mx=e.clientX*dpr;my=e.clientY*dpr;if(Math.random()<.6)T.push({x:mx,y:my,l:1,h:HUE[Math.random()*3|0]})}
addEventListener('pointermove',pt);addEventListener('pointerdown',pt);addEventListener('contextmenu',e=>e.preventDefault());
function burst(x,y,n,sp=8){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(Math.random()*sp+1)*dpr;B.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:[42,340,215,170][Math.random()*4|0]})}}

// ===== TAHAN UNTUK MASUK =====
const HOLD_MS=1500,btn=$('btn'),bar=$('bar');let prog=0,holding=false,done=false,last=performance.now(),nextTick=0;
function center(){const r=btn.getBoundingClientRect();return[(r.left+r.width/2)*dpr,(r.top+r.height/2)*dpr]}

// ===== LOOP =====
function loop(t){const dt=Math.min(t-last,50);last=t;
  if(holding&&!done){prog=Math.min(1,prog+dt/HOLD_MS);const[cx,cy]=center(),a=Math.random()*6.283;
    if(Math.random()<.7)B.push({x:cx+Math.cos(a)*80*dpr,y:cy+Math.sin(a)*80*dpr,vx:-Math.cos(a)*2*dpr,vy:-Math.sin(a)*2*dpr,l:1,h:190});
    if(ac&&t>nextTick){tone(SC[Math.min(7,prog*8|0)],0,.35,'triangle',.4);nextTick=t+170}}
  else if(!done)prog=Math.max(0,prog-dt/500);
  bar.style.strokeDashoffset=377*(1-prog);btn.style.setProperty('--p',prog.toFixed(3));if(prog>=1&&!done)finish();
  ctx.clearRect(0,0,W,H);
  for(const p of P){p.y-=p.vy;if(p.y<0)p.y=H;const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy)||1;
    if(d<150*dpr){p.x+=dx/d*2.5*dpr;p.y+=dy/d*2.5*dpr}
    ctx.fillStyle=`hsla(${p.h},100%,80%,${.35+.65*Math.abs(Math.sin(t/700+p.tw))})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+prog*1.6),0,6.283);ctx.fill()}
  for(let i=T.length-1;i>=0;i--){const q=T[i];q.l-=.04;if(q.l<=0){T.splice(i,1);continue}ctx.fillStyle=`hsla(${q.h},100%,75%,${q.l*.7})`;ctx.beginPath();ctx.arc(q.x,q.y,5*dpr*q.l,0,6.283);ctx.fill()}
  for(let i=B.length-1;i>=0;i--){const b=B[i];b.x+=b.vx;b.y+=b.vy;b.vy+=.07*dpr;b.l-=.014;if(b.l<=0){B.splice(i,1);continue}ctx.fillStyle=`hsla(${b.h},100%,70%,${b.l})`;ctx.beginPath();ctx.arc(b.x,b.y,3.5*dpr*b.l,0,6.283);ctx.fill()}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function down(){if(done)return;initAudio();tone(660,0,.14,'triangle',.5);holding=true;btn.classList.add('hold');$('hint').textContent=TEXT.hintHold;if(navigator.vibrate)navigator.vibrate(15)}
function up(){holding=false;btn.classList.remove('hold');if(!done)$('hint').textContent=TEXT.hintIdle}
btn.addEventListener('pointerdown',e=>{e.preventDefault();down()});
['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,up));
btn.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!holding){e.preventDefault();down()}});btn.addEventListener('keyup',up);
function finish(){done=true;holding=false;chime();if(navigator.vibrate)navigator.vibrate([30,40,60]);
  const[cx,cy]=center();burst(cx,cy,180,10);setTimeout(()=>burst(W/2,H/2,140,9),280);setTimeout(()=>burst(W/2,H*.35,100,8),520);
  $('gate').classList.add('gone');setTimeout(()=>{$('gate').style.display='none';$('links').classList.add('show')},700)}

// ===== MIRINGKAN HP: intro baru mulai setelah HP dimiringkan (landscape). Laptop/PC langsung mulai =====
let introStarted=false,lastPortrait=null;
function startIntro(){if(introStarted)return;introStarted=true;setTimeout(()=>burst(W/2,H*.36,120,9),8900)} // percikan saat logo muncul
function reseedParticles(){for(const p of P){p.x=Math.random()*W;p.y=Math.random()*H}}
function applyOrientation(){
  const need=!!window.IS_PHONE&&window.isPortrait();
  document.documentElement.classList.toggle('rot',need);
  if(lastPortrait!==null&&lastPortrait!==window.isPortrait()){size();reseedParticles()}
  lastPortrait=window.isPortrait();
  if(!need&&!document.documentElement.classList.contains('pend'))startIntro();
}
addEventListener('resize',applyOrientation);addEventListener('orientationchange',()=>setTimeout(applyOrientation,150));
if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',applyOrientation);
if(window.IS_PHONE)setInterval(applyOrientation,600); // cadangan untuk browser HP yang telat memberi sinyal

// ===== (VERSI B) MUSIK MULAI DARI AWAL, SINKRON DENGAN ANIMASI =====
const HTMLEL=document.documentElement;
function releasePend(){HTMLEL.classList.remove('pend','needtap');applyOrientation()}
window.__afterMusicOn=()=>{if(HTMLEL.classList.contains('needtap'))releasePend()};
function probeAutoplay(){return new Promise(res=>{
  let done=false;const fin=v=>{if(done)return;done=true;res(v)};
  if(musicOn){fin(true);return}
  starting=true;bgm.volume=.05;
  const ok=()=>{musicOn=true;starting=false;fadeTo(MUSIC_VOL,1800);fin(true)},no=()=>{starting=false;fin(false)};
  try{const p=bgm.play();if(p&&p.then)p.then(ok,no);else ok()}catch(e){no()}
  setTimeout(()=>fin(true),2200)})} // masih memuat lagu (belum ditolak) = autoplay diizinkan
probeAutoplay().then(ok=>{if(ok)releasePend();else HTMLEL.classList.add('needtap')});
function tapStart(){initAudio();startMusic();clickSfx();releasePend()}
$('tapgate').addEventListener('click',tapStart);
$('tapgate').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapStart()}});

applyOrientation();
</script>
</body>
